[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web", "dist", ".venv", "wheels"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "PIE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["trio_mix", "run", "launcher", "osc_demo", "package"]

[tool.mypy]
python_version = "3.10"
files = ["trio_mix", "run.py", "launcher.py", "osc_demo.py", "package.py"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sounddevice", "pythonosc.*", "qrcode"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
