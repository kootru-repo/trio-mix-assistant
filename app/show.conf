# ============================================================
#  Trio Mix-Assistant — show configuration
#  Edit the values, save, then start the app.  Put comments on their own line: a space
#  followed by # inside a value also ends the value.
# ============================================================

# Mode:  hardware  = drive the real M32C
#        emulate   = full app against a built-in fake console (no gear, rehearse)
#        sim       = pure simulation
MODE=sim

# Your M32C console's IP address (hardware mode).
CONSOLE_IP=192.168.1.50

# Auto-detect the input device + size the channel map + set input gain? (yes/no)
#   For a small interface or a single USB mic, in hardware and emulate modes; leave
#   it off in sim. Leave it off with the console's multichannel USB feed too (it
#   treats the last input as the measurement mic). Overrides AUDIO_DEVICE/INPUT_GAIN
#   below; OUTPUT_DEVICE is not used with it.
AUTO=no

# Audio input device for the "listening half".
#   Run the app with --list-devices to see the options, then put the NUMBER or exact
#   NAME here. On Windows use the NUMBER of the WASAPI entry: a name picks the first
#   entry with that name, which is not the WASAPI one. Used in hardware mode only.
#   Leave blank to run manual mixing + scene recall only (assistant idle).
AUDIO_DEVICE=

# Output device the calibration pink noise plays to — point at the PA.
#   Put the device's exact NAME here (--list-devices shows inputs only).
#   Leave blank for the OS default output (often the laptop speakers!).
#   Used in hardware mode only.
OUTPUT_DEVICE=

# Digital input boost in dB for a quiet mic/interface (e.g. a dynamic Samson Q9U).
#   Leave blank for none; try 20-40 if calibration reports the mic is too quiet.
#   Used in hardware mode only.
INPUT_GAIN=

# Optional show template (per-song scenes + reference levels).
#   A .json file, given relative to this folder (the examples are in templates/,
#   e.g. templates/pilot_13_input.json), or blank for the built-in trio set.
TEMPLATE=

# Venue name — tags the session log (sessions.db) for that room's history, and
#   loads what the app learned about that room in earlier runs with this name
#   (simulation and rehearse runs count too).
VENUE=

# Serve to tablets over the LAN? (yes/no)  yes needs a PIN below, or ALLOW_OPEN=yes.
LAN=no

# Use HTTPS when serving the network (LAN=yes), so tablets get a real PWA + screen
# wake-lock? (yes/no) With LAN=no and TRUST=no the dashboard is plain http on this
# computer only.
HTTPS=yes

# Use a certificate signed by a local root CA, so devices that install the root see no
# warning? (yes/no) Implies HTTPS. The start window prints the install steps.
TRUST=no

# Access PIN for the dashboard (at least 6 characters). Required when LAN=yes
#   (unless ALLOW_OPEN=yes). With a PIN, each phone, tablet or laptop enters it once
#   per run of the app before it can see or control anything.
PIN=

# Allow the dashboard on the network with NO PIN? (yes/no) Anyone on the network could
# then control the console. Use only on a network you fully trust.
ALLOW_OPEN=no

# Dashboard port.
PORT=8770

# Optional: AbleSet automatic scene recall — the UDP port AbleSet sends to.
ABLESET_PORT=
# Optional: accept AbleSet messages only from this IP address (the AbleSet computer).
#   Blank = the first computer that sends them.
#   Both AbleSet settings are used in hardware mode only.
ABLESET_FROM=

# Full test (run `TrioMixAssistant --vet`, no other flags): it uses MODE, LAN, PIN and
#   PORT from this file, tests the built-in emulator and this computer, and with
#   MODE=hardware also the console (using CONSOLE_IP, AUDIO_DEVICE and OUTPUT_DEVICE). The keys
#   below add to it; they change nothing for a normal start. Keep the PA OFF when
#   you use VET_CHANNEL, VET_GAIN or VET_MAIN: they change console values, read them
#   back and put them back.
# Console channel number (1-32) to test control on, with MODE=hardware. Blank = the
#   console is only asked to identify itself and send meters.
VET_CHANNEL=
# Also test that channel's preamp gain? (yes/no) Needs VET_CHANNEL.
VET_GAIN=no
# Also test the main mute, main fader, one main-bus EQ band and one FX return? (yes/no)
VET_MAIN=no
# Play 10 seconds of pink noise and check the measurement input hears it? (yes/no)
#   Needs MODE=hardware and AUDIO_DEVICE. The noise plays through OUTPUT_DEVICE (or the
#   system default).
VET_SOUND=no
# Wait up to 2 minutes for a phone or tablet to sign in? (yes/no) Needs LAN=yes and a PIN.
VET_PHONE=no

# Optional: where the session log (decisions per show, used for venue learning) is kept.
#   Blank = sessions.db beside this file. A path is taken relative to this folder.
#   off = keep no log (venue learning then has nothing to learn from).
#   The log stays on this computer.
SESSION_DB=
