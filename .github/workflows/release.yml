name: Release

# Builds the three downloads from a version tag in Trust Ratchet's reusable release, pinned
# to one commit (release v0.2.1): the tag must have passed ci-ok, each build must report the
# tag's version and commit, SHA256SUMS.txt is written and the files are attested, then
# downloaded again and checked. If the release exists its files are replaced in place (the
# owner's policy: a release is rebuilt, not re-versioned, for changes that are not new
# features or fixes). Run by hand with "rehearse" to build and check without publishing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.2.9"
        required: true
      rehearse:
        description: "Build and check at the chosen branch, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  checks: read
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: kootru-repo/trust-ratchet/.github/workflows/release.yml@5a7c8843fdd1db81150b85dfcb093a46979778dd # v0.2.1
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse }}
      rebuild-in-place: true
      title: Trio Mix-Assistant ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      targets: '[{"os":"macos-latest","asset":"TrioMixAssistant-macos-arm64.tar.gz"},{"os":"macos-15-intel","asset":"TrioMixAssistant-macos-x64.tar.gz"},{"os":"windows-2022","asset":"TrioMixAssistant-windows-x64.zip"}]'
      working-directory: app/ts
      install-command: npm ci --foreground-scripts
      build-command: |
        want="v$(node -p 'require("./package.json").version')"
        if [ "${want}" != "${TAG}" ]; then echo "Tag ${TAG} does not match package.json (${want})."; exit 1; fi
        npm run check
        TRIO_MIX_COMMIT="${RELEASE_COMMIT}" npm run exe
        if grep -q 'could not be downloaded' dist/exe/NODE-LICENSE.txt; then echo "The Node licence text was not downloaded."; exit 1; fi
      dist-dir: dist/exe
      version-command: ./dist/exe/TrioMixAssistant* --version | grep -F "(${RELEASE_COMMIT:0:12})"
