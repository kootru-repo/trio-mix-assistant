name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Committed JavaScript matches the TypeScript source
        run: git diff --exit-code -- ../static

  typescript:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check (core must stay free of platform APIs)
        run: npm run check
      - name: Test against the Python reference fixtures
        run: npm test
