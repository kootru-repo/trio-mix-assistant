name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Committed JavaScript matches the TypeScript source
        run: |
          git diff --exit-code -- ../static
          test -z "$(git ls-files --others --exclude-standard -- ../static)"
        shell: bash

  typescript:
    name: typescript (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
        node: ["22.13", "22"]
        include:
          - os: macos-latest
            node: "22"
    defaults:
      run:
        working-directory: app/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/ts/package-lock.json
      - name: Install
        run: npm ci --foreground-scripts
      - name: Type-check (core must stay free of platform APIs)
        run: npm run check
      - name: Test against the recorded reference fixtures
        run: npm test
      - name: Build the single-file app
        if: runner.os == 'macOS'
        run: |
          npm run exe
          tar -czf TrioMixAssistant-macos-arm64.tar.gz -C dist/exe .
      - name: Keep the macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: TrioMixAssistant-macos-arm64
          path: app/ts/TrioMixAssistant-macos-arm64.tar.gz
          retention-days: 30
