name: CI

# Lint, type-check and tests run in Trust Ratchet's reusable gate, pinned to one commit
# (release v0.2.1), and Ratchet's own checks (.ratchet/) run on every change there too.
# The dashboard build and the macOS app stay here. ci-ok stays here,
# so the ruleset on main can require it by name.
on:
  push:
    branches: [main, dashboard-ts]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    uses: kootru-repo/trust-ratchet/.github/workflows/gate.yml@5a7c8843fdd1db81150b85dfcb093a46979778dd # v0.2.1
    with:
      working-directory: app/ts
      node-version: "22"
      os-matrix: '["windows-2022","ubuntu-latest","macos-latest","macos-15-intel"]'
      install-command: npm ci --foreground-scripts
      lint-command: npm run lint
      check-command: npm run check
      test-command: npm test
      ratchet-check: true
      ratchet-checks: lf-line-endings,fixtures-unchanged
      ratchet-package: github:kootru-repo/trust-ratchet#5a7c8843fdd1db81150b85dfcb093a46979778dd

  gate-oldest-node:
    uses: kootru-repo/trust-ratchet/.github/workflows/gate.yml@5a7c8843fdd1db81150b85dfcb093a46979778dd # v0.2.1
    with:
      working-directory: app/ts
      node-version: "22.13"
      os-matrix: '["windows-2022","ubuntu-latest"]'
      install-command: npm ci --foreground-scripts
      check-command: npm run check
      test-command: npm test

  dashboard:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Committed JavaScript matches the TypeScript source
        run: |
          git diff --exit-code -- ../static
          test -z "$(git ls-files --others --exclude-standard -- ../static)"
        shell: bash

  mac-app:
    name: mac-app (${{ matrix.mac }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mac: arm64
          - os: macos-15-intel
            mac: x64
    defaults:
      run:
        working-directory: app/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ts/package-lock.json
      - name: Install
        run: npm ci --foreground-scripts
      - name: Build the single-file app
        run: |
          npm run exe
          tar -czf TrioMixAssistant-macos-${{ matrix.mac }}.tar.gz -C dist/exe .
      - name: Keep the macOS app
        uses: actions/upload-artifact@v7
        with:
          name: TrioMixAssistant-macos-${{ matrix.mac }}
          path: app/ts/TrioMixAssistant-macos-${{ matrix.mac }}.tar.gz
          retention-days: 30

  serial:
    # Tests that use real threads and the real clock run one at a time here, apart from the parallel suite in the gate,
    # so a busy runner does not make them fail. They check that things happen, with loose bounds on how fast.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest, macos-15-intel]
    defaults:
      run:
        working-directory: app/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:serial

  perf:
    # Report only, for now: block analysis time against the 21.3 ms block, normalised by a calibration workload. It goes in the
    # run summary and never fails CI; after about 20 runs the numbers become the baseline it gates against.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: app/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bench

  ci-ok:
    name: ci-ok
    if: always()
    needs: [gate, gate-oldest-node, dashboard, mac-app, serial]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not pass ($r)"
              exit 1
            fi
          done
