<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The warning macOS shows the first time you run Trio Mix-Assistant</title>
  <desc id="d">Illustration of a macOS dialog saying TrioMixAssistant was not opened, with the buttons Move to Trash and Done. Done is highlighted.</desc>
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter></defs>
  <rect width="860" height="470" fill="#e9ebef"/>
  <g filter="url(#sh)"><rect x="290" y="30" width="280" height="340" rx="18" fill="#f6f6f7"/></g>
  <rect x="290.5" y="30.5" width="279" height="339" rx="18" fill="none" stroke="#c9c9ce"/>
  <path d="M430 58 L462 114 H398 Z" fill="#f5b800" stroke="#d99a00" stroke-width="2" stroke-linejoin="round"/>
  <rect x="427.5" y="76" width="5" height="20" rx="2.5" fill="#1d1d1f"/><circle cx="430" cy="104" r="3" fill="#1d1d1f"/>
  <text x="430" y="150" font-size="14.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">“TrioMixAssistant”</text>
  <text x="430" y="170" font-size="14.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">Not Opened</text>
  <g font-size="12" fill="#3a3a40" text-anchor="middle">
    <text x="430" y="198">Apple could not verify</text>
    <text x="430" y="215">“TrioMixAssistant” is free of malware</text>
    <text x="430" y="232">that may harm your Mac or</text>
    <text x="430" y="249">compromise your privacy.</text>
  </g>
  <rect x="312" y="276" width="236" height="32" rx="8" fill="#e3e3e8"/>
  <text x="430" y="297" font-size="13.5" fill="#1d1d1f" text-anchor="middle">Move to Trash</text>
  <rect x="312" y="318" width="236" height="32" rx="8" fill="#2f6fe4"/>
  <text x="430" y="339" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">Done</text>
  <rect x="304" y="311" width="252" height="46" rx="13" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <line x1="296" y1="292" x2="236" y2="292" stroke="#c0392b" stroke-width="2"/>
  <text x="228" y="288" font-size="13.5" font-weight="700" fill="#c0392b" text-anchor="end">Do not click this.</text>
  <text x="228" y="306" font-size="12.5" fill="#6b6b73" text-anchor="end">It deletes the app.</text>
  <line x1="562" y1="334" x2="622" y2="334" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="330" font-size="13.5" font-weight="700" fill="#1d1d1f">Click Done,</text>
  <text x="630" y="348" font-size="12.5" fill="#6b6b73">then use Open Anyway</text>
  <text x="630" y="364" font-size="12.5" fill="#6b6b73">(next picture).</text>

  <text x="430" y="412" font-size="14" fill="#1d1d1f" text-anchor="middle">This is expected: the app is not signed by a registered developer.</text>
  <text x="430" y="446" font-size="11.5" fill="#6b6b73" text-anchor="middle">Illustration, not a screenshot. Your Mac's wording and layout may differ slightly.</text>
</svg>
