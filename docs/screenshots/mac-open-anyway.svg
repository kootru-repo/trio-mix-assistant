<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Where to click Open Anyway for Trio Mix-Assistant on a Mac</title>
  <desc id="d">Illustration of System Settings, Privacy and Security. Under Security, a message says TrioMixAssistant was blocked, with an Open Anyway button highlighted.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".18"/></filter>
    <clipPath id="win"><rect x="20" y="20" width="820" height="540" rx="14"/></clipPath>
  </defs>
  <rect width="860" height="640" fill="#e9ebef"/>
  <g filter="url(#sh)"><rect x="20" y="20" width="820" height="540" rx="14" fill="#f6f6f7"/></g>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="250" height="540" fill="#ececee"/>
    <rect x="270" y="20" width="1" height="540" fill="#d4d4d8"/>
    <rect x="271" y="20" width="569" height="56" fill="#f6f6f7"/>
    <rect x="271" y="76" width="569" height="1" fill="#dcdce0"/>
  </g>
  <rect x="20.5" y="20.5" width="819" height="539" rx="14" fill="none" stroke="#c9c9ce"/>

  <circle cx="46" cy="48" r="7" fill="#ff5f57"/><circle cx="68" cy="48" r="7" fill="#febc2e"/><circle cx="90" cy="48" r="7" fill="#28c840"/>

  <rect x="34" y="74" width="222" height="30" rx="8" fill="#dedee2"/>
  <circle cx="50" cy="88" r="5.5" fill="none" stroke="#7b7b82" stroke-width="1.6"/><line x1="54" y1="92" x2="58" y2="96" stroke="#7b7b82" stroke-width="1.6" stroke-linecap="round"/>
  <text x="66" y="93" font-size="13.5" fill="#8a8a91">Search</text>

  <g font-size="13.5" fill="#1d1d1f">
    <rect x="38" y="124" width="20" height="20" rx="5" fill="#3b82f6"/><text x="68" y="139">Wi‑Fi</text>
    <rect x="38" y="154" width="20" height="20" rx="5" fill="#3b82f6"/><text x="68" y="169">Bluetooth</text>
    <rect x="38" y="184" width="20" height="20" rx="5" fill="#3b82f6"/><text x="68" y="199">Network</text>
    <rect x="38" y="226" width="20" height="20" rx="5" fill="#ef4444"/><text x="68" y="241">Notifications</text>
    <rect x="38" y="256" width="20" height="20" rx="5" fill="#ec4899"/><text x="68" y="271">Sound</text>
    <rect x="38" y="286" width="20" height="20" rx="5" fill="#6366f1"/><text x="68" y="301">Focus</text>
    <rect x="38" y="328" width="20" height="20" rx="5" fill="#8e8e93"/><text x="68" y="343">General</text>
    <rect x="38" y="358" width="20" height="20" rx="5" fill="#1d1d1f"/><text x="68" y="373">Appearance</text>
    <rect x="38" y="388" width="20" height="20" rx="5" fill="#3b82f6"/><text x="68" y="403">Accessibility</text>
  </g>
  <rect x="32" y="424" width="226" height="32" rx="8" fill="#2f6fe4"/>
  <rect x="38" y="430" width="20" height="20" rx="5" fill="#ffffff" fill-opacity=".25"/>
  <text x="68" y="445" font-size="13.5" font-weight="600" fill="#fff">Privacy &amp; Security</text>
  <g>
    <circle cx="20" cy="440" r="13" fill="#f59e0b"/><text x="20" y="445" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  </g>

  <text x="296" y="54" font-size="17" font-weight="700" fill="#1d1d1f">Privacy &amp; Security</text>

  <text x="296" y="112" font-size="14" font-weight="700" fill="#1d1d1f">Security</text>

  <rect x="296" y="126" width="520" height="92" rx="10" fill="#fff" stroke="#e1e1e6"/>
  <text x="312" y="152" font-size="13.5" fill="#1d1d1f">Allow applications from</text>
  <circle cx="320" cy="174" r="7" fill="#fff" stroke="#b9b9c0"/><text x="336" y="179" font-size="13.5" fill="#1d1d1f">App Store</text>
  <circle cx="320" cy="198" r="7" fill="#2f6fe4"/><circle cx="320" cy="198" r="2.8" fill="#fff"/><text x="336" y="203" font-size="13.5" fill="#1d1d1f">App Store &amp; Known Developers</text>

  <rect x="296" y="232" width="520" height="112" rx="10" fill="#fff" stroke="#e1e1e6"/>
  <text x="312" y="262" font-size="13.5" fill="#1d1d1f">“TrioMixAssistant” was blocked to protect your Mac.</text>
  <rect x="312" y="282" width="488" height="1" fill="#ececf0"/>
  <rect x="686" y="298" width="114" height="30" rx="7" fill="#fff" stroke="#c7c7cd"/>
  <text x="743" y="318" font-size="13.5" fill="#1d1d1f" text-anchor="middle">Open Anyway</text>
  <rect x="678" y="290" width="130" height="46" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="662" cy="313" r="13" fill="#f59e0b"/><text x="662" y="318" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <rect x="296" y="358" width="520" height="88" rx="10" fill="#fff" stroke="#e1e1e6"/>
  <rect x="312" y="370" width="22" height="22" rx="5" fill="#8e8e93"/><text x="346" y="386" font-size="13.5" fill="#1d1d1f">FileVault</text><text x="786" y="386" font-size="13.5" fill="#8a8a91" text-anchor="end">On  ›</text>
  <rect x="312" y="402" width="488" height="1" fill="#ececf0"/>
  <rect x="312" y="412" width="22" height="22" rx="5" fill="#3b82f6"/><text x="346" y="428" font-size="13.5" fill="#1d1d1f">Lockdown Mode</text><text x="786" y="428" font-size="13.5" fill="#8a8a91" text-anchor="end">Off  ›</text>

  <rect x="296" y="466" width="520" height="1" fill="none"/>
  <text x="296" y="488" font-size="12.5" fill="#6b6b73">Scroll down in Privacy &amp; Security to reach the Security section.</text>
  <text x="296" y="508" font-size="12.5" fill="#6b6b73">The message appears only after you have tried to run the app once.</text>

  <g font-size="14" fill="#1d1d1f">
    <circle cx="36" cy="590" r="12" fill="#f59e0b"/><text x="36" y="595" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="56" y="595">Apple menu → System Settings → <tspan font-weight="700">Privacy &amp; Security</tspan></text>
    <circle cx="430" cy="590" r="12" fill="#f59e0b"/><text x="430" y="595" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="450" y="595">Click <tspan font-weight="700">Open Anyway</tspan>, then run the app again</text>
  </g>
  <text x="430" y="624" font-size="11.5" fill="#6b6b73" text-anchor="middle">Illustration, not a screenshot. Your Mac's wording and layout may differ slightly.</text>
</svg>
